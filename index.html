:root{
  --bg:#FDFBF8;
  --bg2:#F8F3ED;
  --ink:#463A32;
  --taupe:#A68A70;      /* орнамент, линии */
  --accent:#8A6C54;     /* кнопки, подписи */
  --line:#DED2C6;
  --font:'CG','Cormorant Garamond','Palatino Linotype',Georgia,serif;
  --ease:cubic-bezier(.22,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--font);font-weight:500;font-size:clamp(22px,2.4vw,25px);line-height:1.55;color:var(--ink);background:var(--bg);overflow-x:hidden;font-variant-numeric:lining-nums}
/* тонкая рамка по краю страницы */
body::before{content:"";position:fixed;inset:12px;border:1px solid var(--line);pointer-events:none;z-index:50}
@media (max-width:600px){body::before{inset:7px}}
img{display:block;max-width:100%}
section{padding:104px 26px;position:relative}
.wrap{max-width:1040px;margin:0 auto}
.narrow{max-width:720px;margin:0 auto}
h1,h2,h3{font-weight:600;line-height:1.15;color:var(--ink)}
h2{font-size:clamp(34px,6vw,54px);text-align:center;font-style:italic;margin-bottom:14px}
.label{font-size:clamp(17px,2vw,19px);font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:4px}

/* ---------- настоящий якутский орнамент (маска из векторного рисунка) ---------- */
.orn{background:var(--taupe);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain;margin:0 auto}
.orn.motif{width:clamp(96px,22vw,128px);aspect-ratio:300/255;-webkit-mask-image:var(--om);mask-image:var(--om)}

/* ---------- появление блоков ---------- */
.js .rv{opacity:0;transform:translateY(26px);transition:opacity 1.2s var(--ease) var(--d,0s),transform 1.2s var(--ease) var(--d,0s)}
.js .rv.in{opacity:1;transform:none}
.js .rv.sc{transform:scale(.965)}
.js .rv.sc.in{transform:none}
.js .orn.rv{opacity:0;transform:scaleX(.35);transition:opacity 1.4s var(--ease) var(--d,0s),transform 1.8s var(--ease) var(--d,0s)}
.js .orn.rv.in{opacity:1;transform:none}
.js .orn.lace.rv.in{opacity:.9}
.js .wipe{opacity:0;transform:scale(1.035);transition:opacity 1.6s var(--ease) var(--d,0s),transform 2.2s var(--ease) var(--d,0s)}
.js .wipe.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.js .rv,.js .orn.rv,.js .wipe{opacity:1!important;transform:none!important;transition:none!important}}

/* ---------- кнопки ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:64px;padding:14px 44px;font:700 clamp(19px,2.2vw,21px)/1.2 var(--font);letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--accent);border:1.5px solid var(--accent);text-decoration:none;cursor:pointer;transition:background .35s,color .35s,transform .35s var(--ease),box-shadow .35s}
.btn:hover{background:#6F543F;border-color:#6F543F;transform:translateY(-2px);box-shadow:0 10px 24px rgba(110,80,50,.18)}
.btn.alt{background:transparent;color:var(--accent)}
.btn.alt:hover{background:var(--accent);color:#fff}

/* ---------- 1. главный экран ---------- */
.hero{min-height:100svh;display:flex;align-items:center;padding:70px 26px 90px;background:radial-gradient(ellipse at 50% 30%,#F6EFE7 0,transparent 65%),var(--bg)}
.hero .wrap{display:grid;gap:44px;align-items:center;justify-items:center;text-align:center;width:100%}
.hero-photo{order:1}.hero-text{order:2}
.arch{position:relative;width:min(340px,76vw);aspect-ratio:2/3;border-radius:999px 999px 4px 4px;border:1.5px solid var(--taupe);padding:11px;background:var(--bg);box-shadow:0 26px 60px rgba(110,80,50,.13)}
.arch::after{content:"";position:absolute;inset:-15px;border:1px solid var(--line);border-radius:999px 999px 8px 8px;pointer-events:none}
.arch img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:999px 999px 2px 2px}
.hero .label{margin-bottom:10px;font-size:clamp(19px,2.5vw,25px);line-height:1.55;letter-spacing:.12em}
.hero h1{font-size:clamp(44px,10vw,78px);letter-spacing:.01em;margin-bottom:6px}
.age{display:flex;align-items:baseline;justify-content:center;gap:14px;line-height:1;margin:6px 0 4px}
.age .n{font-size:clamp(96px,24vw,176px);font-weight:500;color:var(--taupe)}
.age .w{font-size:clamp(36px,7vw,56px);font-style:italic;font-weight:600;color:var(--accent)}
.jub{font-size:clamp(20px,2.4vw,23px);letter-spacing:.3em;text-transform:uppercase;font-weight:700;color:var(--ink);margin-bottom:18px}
.motto{font-size:clamp(26px,4vw,32px);font-style:italic;font-weight:600;margin-bottom:34px;color:var(--ink)}
.hero .btn svg{width:18px;height:18px;flex:none}
@media (min-width:920px){
  .hero .wrap{grid-template-columns:.9fr 1.1fr;gap:80px;text-align:left;justify-items:stretch}
  .hero-photo{order:1;justify-self:center}.hero-text{order:2}
  .arch{width:min(410px,34vw)}
  .age{justify-content:flex-start}
}

/* ---------- 2. приглашение ---------- */
.invite{background:var(--bg2);text-align:center}
.invite .motif{margin-bottom:36px}
.poem{font-style:italic;font-weight:600;font-size:clamp(26px,5.4vw,36px);line-height:1.6}
.poem p{margin:0}
.sign{margin-top:44px}
.sign .line{width:64px;height:1px;background:var(--taupe);margin:0 auto 22px}
.sign .nm{font-size:clamp(22px,3.4vw,28px);font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}

/* ---------- 3. о празднике ---------- */
.details{text-align:center}
.details .lace{margin-bottom:56px}
.facts{display:grid;max-width:1000px;margin:46px auto 0}
.fact{padding:34px 24px;border-top:1px solid var(--line)}
.fact:first-child{border-top:0}
.fact .label{margin-bottom:14px}
.fact .v{font-size:clamp(32px,5vw,42px);font-weight:600;line-height:1.15}
.fact .s{font-size:clamp(23px,3vw,27px);font-style:italic;font-weight:500;color:var(--ink);margin-top:4px}
.fact .s + .v{margin-top:18px}
@media (min-width:860px){
  .facts{grid-template-columns:repeat(3,1fr)}
  .fact{border-top:0;border-left:1px solid var(--line);padding:10px 26px}
  .fact:first-child{border-left:0}
}
.center{margin-top:48px}

/* ---------- 4. отсчёт ---------- */
.count{background:var(--bg2);text-align:center}
.timer{display:flex;justify-content:center;align-items:flex-start;gap:clamp(6px,2.4vw,30px);margin-top:36px}
.unit{text-align:center;min-width:0}
.unit b{display:block;font-size:clamp(54px,14vw,112px);font-weight:500;line-height:1;color:var(--taupe);font-variant-numeric:lining-nums tabular-nums}
.unit span{display:block;margin-top:10px;font-size:clamp(17px,3.8vw,23px);font-weight:600;color:var(--ink)}
.sep{font-size:clamp(54px,14vw,112px);line-height:1;color:var(--line);font-weight:500}
@media (max-width:520px){.sep{display:none}.timer{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}}
.timer-done{font-size:clamp(30px,5vw,44px);font-style:italic;font-weight:600;color:var(--accent);margin-top:34px;display:none}

/* ---------- 5. вторая фотография ---------- */
.portrait-sec{text-align:center;padding-bottom:150px}
@media (max-width:600px){.badge{--bs:124px}.portrait-sec{padding-bottom:130px}}
.frame{position:relative;max-width:900px;margin:0 auto;padding:12px;border:1.5px solid var(--taupe);background:var(--bg);box-shadow:0 26px 60px rgba(110,80,50,.12)}
.frame::after{content:"";position:absolute;inset:-14px;border:1px solid var(--line);pointer-events:none}
.frame img{width:100%;height:auto}
.badge{--bs:150px;position:absolute;left:calc(50% - var(--bs)/2);bottom:calc(var(--bs)/-1.75);width:var(--bs);height:var(--bs);border-radius:50%;background:var(--bg);border:1.5px solid var(--taupe);box-shadow:0 0 0 7px var(--bg),0 0 0 8.5px var(--line),0 14px 34px rgba(110,80,50,.14);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2}
.badge b{font-size:calc(var(--bs)*.45);font-weight:600;line-height:.9;color:var(--ink)}
.badge span{font-size:calc(var(--bs)*.19);font-style:italic;font-weight:600;color:var(--accent);line-height:1.1}

/* ---------- 6. анкета ---------- */
.rsvp{background:var(--bg2)}
.box{max-width:760px;margin:0 auto;border:1px solid var(--line);background:#fff;padding:64px 34px 56px;text-align:center}
@media (max-width:600px){.box{padding:48px 20px 44px}}
.box .lead{font-size:clamp(23px,3vw,27px);margin-top:10px}
.box .lead2{font-size:clamp(23px,3vw,27px);font-weight:700;margin-top:18px}
form{max-width:560px;margin:40px auto 0;text-align:left}
.f{display:block;margin-bottom:10px}
input[type=text]{width:100%;min-height:66px;font:500 24px var(--font);color:var(--ink);background:#fff;border:1.5px solid #8F8174;border-radius:0;padding:12px 20px;margin-bottom:30px;transition:border-color .3s,box-shadow .3s}
input[type=text]::placeholder{color:#968A7E;text-transform:uppercase;letter-spacing:.06em;opacity:1}
input[type=text]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(138,108,84,.18)}
fieldset{border:0;margin-bottom:34px}
legend{margin-bottom:16px}
.choice{display:flex;align-items:center;gap:18px;padding:12px 0;cursor:pointer}
.choice input{position:absolute;opacity:0}
.choice .dot{flex:none;width:36px;height:36px;border-radius:50%;border:2px solid var(--taupe);display:grid;place-items:center;transition:border-color .3s,background .3s}
.choice .dot::after{content:"";width:18px;height:18px;border-radius:50%;background:var(--accent);transform:scale(0);transition:transform .35s var(--ease)}
.choice input:checked + .dot{border-color:var(--accent)}
.choice input:checked + .dot::after{transform:scale(1)}
.choice input:focus-visible + .dot{outline:3px solid var(--accent);outline-offset:3px}
.choice .t{font-size:clamp(21px,2.6vw,24px);font-weight:600;letter-spacing:.05em;text-transform:uppercase;line-height:1.3}
.send-wrap{text-align:center}
.send-wrap .btn{width:min(100%,360px)}
.msg{margin-top:22px;padding:16px;font-size:22px;text-align:center;display:none}
.msg.err{display:block;background:#FBEDE8;border:1.5px solid #A8432E;color:#6B2415}
.note{margin-top:36px;font-size:clamp(19px,2.4vw,22px);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600;line-height:1.5}
.thanks{display:none;max-width:560px;margin:40px auto 0;padding:10px 0}
.thanks h3{font-size:clamp(36px,6vw,48px);font-style:italic;margin:18px 0 8px}
.thanks p{font-size:clamp(24px,3.4vw,28px)}

/* ---------- 7. связь + финал ---------- */
.contact{text-align:center;padding:90px 26px 40px}
.contact p{max-width:560px;margin:0 auto 28px;font-size:clamp(23px,3vw,27px)}
.wa{display:inline-flex;align-items:center;gap:20px;text-decoration:none;color:var(--ink)}
.wa .ic{width:84px;height:84px;border-radius:50%;background:var(--accent);display:grid;place-items:center;transition:transform .4s var(--ease),background .3s,box-shadow .4s}
.wa .ic svg{width:44px;height:44px;fill:#fff}
.wa:hover .ic{transform:translateY(-3px) scale(1.04);background:#6F543F;box-shadow:0 12px 26px rgba(110,80,50,.22)}
.wa .tx{font-size:23px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.finale{text-align:center;padding:90px 26px 120px}
.finale .warm{font-size:clamp(46px,10vw,92px);font-style:italic;font-weight:600;line-height:1.1;margin-bottom:56px}

/* ---- 50 на первом фото, второе фото с плавным краем ---- */
.hero-photo{text-align:center;padding-bottom:70px}
.hero h1{margin-bottom:10px}
.hero .jub{margin-bottom:32px}
.hero-photo .arch .badge{--bs:112px;bottom:calc(var(--bs)/-1.4);z-index:3}
@media (max-width:600px){.hero-photo .arch .badge{--bs:96px}}
.portrait-sec{padding-bottom:110px}
.portrait-sec .frame{max-width:640px;padding:0;border:0;background:none;box-shadow:none}
.portrait-sec .frame::after{display:none}
.portrait-sec .frame img{-webkit-mask-image:linear-gradient(to bottom,#000 55%,transparent 100%);mask-image:linear-gradient(to bottom,#000 55%,transparent 100%)}
.portrait-sec .badge{--bs:82px;bottom:-34px;box-shadow:0 0 0 5px var(--bg),0 0 0 6.5px var(--line),0 10px 26px rgba(110,80,50,.12)}
@media (max-width:600px){.portrait-sec .badge{--bs:72px}.portrait-sec{padding-bottom:90px}}
</style>
</head>
<body>

<!-- 1. ГЛАВНЫЙ ЭКРАН -->
<header class="hero" id="top">
  <div class="wrap">
    <div class="hero-photo">
      <div class="arch rv sc">
        <img src="1.PNG" alt="" width="900" height="1350" fetchpriority="high">
        <div class="badge" aria-label="50 саас"><b>50</b><span data-t="year"></span></div>
      </div>
    </div>
    <div class="hero-text">
      <p class="label rv" style="--d:.25s" data-t="kicker"></p>
      <h1 class="rv" style="--d:.4s" data-name></h1>
      <p class="jub rv" style="--d:.55s" data-t="jub"></p>
      <a class="btn rv" style="--d:1s" href="#invite"><span data-t="open"></span>
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3v13M4.5 10.5 10 16l5.5-5.5"/></svg></a>
    </div>
  </div>
</header>

<!-- 2. ПРИГЛАШЕНИЕ -->
<section class="invite" id="invite">
  <div class="narrow">
    <div class="orn motif rv" aria-hidden="true"></div>
    <div class="poem" lang="sah">
      <p class="rv" style="--d:0.00s">Аймах-билэ дьоннорум,</p>
      <p class="rv" style="--d:0.06s">Ахтылҕаннаах доҕотторум,</p>
      <p class="rv" style="--d:0.12s">Үлэбэр, олохпор алтыспыт</p>
      <p class="rv" style="--d:0.18s">Үтүөкэннээх үөлээннээхтэрим,</p>
      <p class="rv" style="--d:0.24s">Аан ийэ дойдуга</p>
      <p class="rv" style="--d:0.30s">Айыллан кэлбиппин бэлиэтиир</p>
      <p class="rv" style="--d:0.36s">Алгыстаах кэрэ күммэр</p>
      <p class="rv" style="--d:0.42s">Үрдүк үөрүүбүн үллэстэ</p>
      <p class="rv" style="--d:0.48s">Кэлиҥ, сылдьыҥ,</p>
      <p class="rv" style="--d:0.54s">Күндү ыалдьыт буолуҥ!</p>
    </div>
  </div>
</section>

<!-- 3. О ПРАЗДНИКЕ -->
<section class="details" id="details">
  <div class="wrap">
    <div class="orn lace rv" aria-hidden="true"></div>
    <h2 class="rv" data-t="detTitle"></h2>
    <div class="facts">
      <div class="fact rv" style="--d:.05s">
        <p class="label" data-t="lblDate"></p>
        <p class="v" data-t="dateYear"></p>
        <p class="s" data-t="dateDay"></p>
      </div>
      <div class="fact rv" style="--d:.2s">
        <p class="label" data-t="lblTime"></p>
        <p class="v">16:00</p><p class="s" data-t="tGather"></p>
        <p class="v">17:00</p><p class="s" data-t="tStart"></p>
      </div>
      <div class="fact rv" style="--d:.35s">
        <p class="label" data-t="lblPlace"></p>
        <p class="v" data-t="placeName"></p>
        <p class="s" data-t="placeAddr"></p>
      </div>
    </div>
    <p class="center rv"><a class="btn alt" target="_blank" rel="noopener" href="https://2gis.ru/yakutsk/firm/70000001026523695/tab/info" data-t="map"></a></p>
  </div>
</section>

<!-- 4. ОБРАТНЫЙ ОТСЧЁТ -->
<section class="count" id="countdown">
  <div class="wrap">
    <p class="label rv" data-t="cdTitle" style="font-size:clamp(19px,2.6vw,23px)"></p>
    <div class="timer rv" id="timer" role="timer" aria-live="off" style="--d:.15s">
      <div class="unit"><b id="d">0</b><span data-t="lblD"></span></div><div class="sep">:</div>
      <div class="unit"><b id="h">00</b><span data-t="lblH"></span></div><div class="sep">:</div>
      <div class="unit"><b id="m">00</b><span data-t="lblM"></span></div><div class="sep">:</div>
      <div class="unit"><b id="s">00</b><span data-t="lblS"></span></div>
    </div>
    <p class="timer-done" id="done" data-t="cdDone"></p>
  </div>
</section>

<!-- 5. ВТОРОЕ ФОТО -->
<section class="portrait-sec" id="portrait">
  <div class="wrap">
    <div class="frame">
      <img class="wipe rv" src="2.PNG" alt="" width="1400" height="933" loading="lazy">
      <div class="badge rv sc" style="--d:.5s" aria-label="50 саас"><b>50</b><span data-t="year"></span></div>
    </div>
  </div>
</section>

<!-- 6. АНКЕТА -->
<section class="rsvp" id="rsvp">
  <div class="box rv">
    <h2 data-t="rsvpTitle"></h2>
    <p class="lead" data-t="rsvpLead"></p>
    <p class="lead2" data-t="rsvpLead2"></p>

    <form id="form" novalidate>
      <label class="f label" for="ln" data-t="lblLn"></label>
      <input type="text" id="ln" name="lastName" autocomplete="family-name" placeholder="Иванов" required>

      <label class="f label" for="fn" data-t="lblFn"></label>
      <input type="text" id="fn" name="firstName" autocomplete="given-name" placeholder="Иван" required>

      <fieldset>
        <legend class="label" data-t="lblAtt"></legend>
        <label class="choice"><input type="radio" name="attend" value="Буду" required><span class="dot"></span><span class="t" data-t="yes"></span></label>
        <label class="choice"><input type="radio" name="attend" value="Не смогу прийти"><span class="dot"></span><span class="t" data-t="no"></span></label>
      </fieldset>

      <div class="send-wrap"><button class="btn" type="submit" id="send" data-t="send"></button></div>
      <div class="msg" id="msg" role="alert"></div>
    </form>

    <div class="thanks" id="thanks" tabindex="-1">
      <div class="orn motif" aria-hidden="true"></div>
      <h3 data-t="thx1"></h3>
      <p data-t="thx2"></p>
    </div>
    <p class="note" data-t="note"></p>
  </div>
</section>

<!-- 7. СВЯЗЬ И ФИНАЛ -->
<section class="contact">
  <p class="rv" data-t="waText"></p>
  <a class="wa rv" style="--d:.15s" id="wa" href="#" target="_blank" rel="noopener" aria-label="WhatsApp">
    <span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.3-.15-1.263-.465-2.403-1.485-.888-.795-1.484-1.77-1.66-2.07-.174-.3-.019-.465.13-.615.136-.135.301-.345.451-.52.146-.181.194-.301.297-.496.1-.21.049-.375-.025-.524-.075-.15-.672-1.62-.922-2.206-.24-.584-.487-.51-.672-.51-.172-.015-.371-.015-.571-.015-.2 0-.523.074-.797.359-.273.3-1.045 1.02-1.045 2.475s1.07 2.865 1.219 3.075c.149.18 2.095 3.195 5.076 4.483.709.3 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.696.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg></span>
    <span class="tx">WhatsApp</span>
  </a>
</section>

<section class="finale">
  <p class="warm rv" data-t="warm"></p>
  <div class="orn pairs rv" style="--d:.2s" aria-hidden="true"></div>
</section>

<script>
/* ============ НАСТРОЙКИ ============ */
const CFG = {
  name: 'Сергей Сидорович Сивцев',
  start: '2026-11-14T17:00:00+09:00',          // 14 ноября 2026, 17:00, Якутск (UTC+9)
  endpoint: 'https://script.google.com/macros/s/AKfycbz-9yn5JEUTKcVpSqum24C3wcShFLheBnX8T6EfPZnYWSYFqQbXx1z7YidzGB0MwGyCRQ/exec',
  whatsapp: 'https://wa.me/+79142277243'                   // ← сюда вставьте ссылку на WhatsApp, например https://wa.me/79140000000
};

/* Все тексты собраны здесь. Якутские тексты — черновики, их нужно проверить носителю языка. */
const T = {
  kicker:'ҮӨРҮҮЛЭЭХ ТЭРЭЭҺИННЭ ЫҤЫРЫЫ', jub:'50 СААҺЫН ТУОЛАР', year:'саас', open:'Салгыы',
  detTitle:'Тэрээһин туһунан',
  lblDate:'Буолар күнэ', dateYear:'2026 сыл', dateDay:'сэтинньи 14 күнэ',
  lblTime:'Буолар кэмэ', tGather:'мустуу', tStart:'саҕаланыыта',
  lblPlace:'Буолар сирэ', placeName:'Эстрада тыйаатыра', placeAddr:'Дьокуускай куорат,\nЛенин пр., 47', map:'картага көр',
  cdTitle:'Буолуор диэри:', lblD:'Күн', lblH:'Чаас', lblM:'Мүнүүтэ', lblS:'Сөкүүндэ', cdDone:'Бырааһынньык саҕаланна!',
  rsvpTitle:'Ыалдьыт ыйытыга',
  rsvpLead:'Үөрүүлээх киэһэбит этэҥҥэ ааһарыгар ыйытыктарга эппиэттиэххит диэн эрэнэбит',
  rsvpLead2:'Бука диэн кэлэргитин биллэриҥ',
  lblLn:'Араспаанньан', lblFn:'Аатын', lblAtt:'Кэлэҕин дуо?',
  yes:'Хайаан да кэлэбин', no:'Хомойуох иһин сатаан кэлбэппин...', send:'Ыыт',
  note:'Ыалтан хас биирдии киһи ыйытыгы толороругар көрдөһөбүт',
  thx1:'Улахан махтал!', thx2:'Эһигини күүтэбит.',
  waText:'Туох эмит ыйытыылаах буоллаххытына миэхэ суруйуоххутун сөп',
  warm:'Көрсүөххэ диэри!'
};
document.querySelectorAll('[data-t]').forEach(e=>{const k=e.dataset.t; if(T[k]!==undefined){ e.textContent=T[k]; if(T[k].includes('\n')) e.style.whiteSpace='pre-line'; }});
document.querySelectorAll('[data-name]').forEach(e=>e.textContent=CFG.name);
document.title = CFG.name + ' · 50 саас';
document.getElementById('wa').href = CFG.whatsapp;

/* ============ ПЛАВНОЕ ПОЯВЛЕНИЕ ============ */
(function(){
  const els=[...document.querySelectorAll('.rv')];
  if(!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'));return;}
  const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target);}}),{threshold:.12,rootMargin:'0px 0px -6% 0px'});
  els.forEach(e=>io.observe(e));
})();

/* ============ ОТСЧЁТ ============ */
const target = new Date(CFG.start).getTime();
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
function tick(){
  const diff = target - Date.now();
  if(diff <= 0){ $('timer').style.display='none'; $('done').style.display='block'; return false; }
  const s = Math.floor(diff/1000);
  $('d').textContent = Math.floor(s/86400);
  $('h').textContent = pad(Math.floor(s%86400/3600));
  $('m').textContent = pad(Math.floor(s%3600/60));
  $('s').textContent = pad(s%60);
  return true;
}
if(tick()){ const iv=setInterval(()=>{ if(!tick()) clearInterval(iv); },1000); }

/* ============ ФОРМА ============ */
const form=$('form'), msg=$('msg');
function showErr(t){ msg.className='msg err'; msg.textContent=t; }
form.addEventListener('submit', async ev=>{
  ev.preventDefault(); msg.className='msg';
  const fn=form.firstName.value.trim(), ln=form.lastName.value.trim();
  const at=(form.attend.value||'');
  if(!fn||!ln||!at){ showErr('Пожалуйста, заполните фамилию, имя и выберите ответ.'); return; }
  if(!CFG.endpoint){ showErr('Форма ещё не подключена к таблице: ответ никуда не отправлен.'); return; }
  const btn=$('send'); btn.disabled=true;
  try{
    await fetch(CFG.endpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({firstName:fn,lastName:ln,attend:at,sentAt:new Date().toISOString()})});
    form.style.display='none'; const t=$('thanks'); t.style.display='block'; t.focus({preventScroll:true});
    t.scrollIntoView({behavior:'smooth',block:'center'});
  }catch(e){
    btn.disabled=false; showErr('Не удалось отправить. Проверьте интернет и попробуйте ещё раз.');
  }
});
</script>
</body>
</html>
